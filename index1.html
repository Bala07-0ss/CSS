<meta name="viewport" content="width=width-device",initial-scale=1.0;>
<style>
    .container{
        background-color: black;
        display: flex;
        flex-wrap: wrap;
    }
    .one{
        background-color: yellowgreen;
       margin: 5px;
       height: 100px;
       flex-basis: 100%;
    }
    .two{
        background-color: red;
        margin: 5px;
        height: 500px;
        flex-basis: 25%;
        flex-grow: 1;

    }
    @media screen and (max-width:900px) {
        .two{
            height: 100px;
            flex-basis: 50%;
        }
        
    }
    @media screen and (max-width:600px){
        .two{
            flex-basis: 100%;
            height: 500px;
           
        }
    }

</style>

<div class="container">
    <div class="one"></div>
    <div class="two"></div>
    <div class="two"></div>
    <div class="two"></div>


</div>
